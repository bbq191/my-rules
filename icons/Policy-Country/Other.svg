<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="50" fill="#6B7280"/>
  <!-- Globe: outline circle + latitude/longitude lines -->
  <g fill="none" stroke="white" stroke-width="2.5">
    <circle cx="50" cy="50" r="22"/>
    <!-- Equator -->
    <line x1="28" y1="50" x2="72" y2="50"/>
    <!-- Vertical meridian -->
    <line x1="50" y1="28" x2="50" y2="72"/>
    <!-- Latitude arcs -->
    <path d="M30,40 Q50,35 70,40"/>
    <path d="M30,60 Q50,65 70,60"/>
    <!-- Longitude ellipses -->
    <ellipse cx="50" cy="50" rx="11" ry="22"/>
  </g>
</svg>
