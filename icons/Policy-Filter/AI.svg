<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="50" fill="#4F46E5"/>
  <!-- 4-pointed sparkle star -->
  <g transform="translate(50,50)" fill="white">
    <!-- Long axis: top-bottom -->
    <path d="M0,-24 C2,-8 2,-2 0,0 C-2,-2 -2,-8 0,-24"/>
    <path d="M0,24  C2,8  2,2  0,0 C-2,2  -2,8  0,24"/>
    <!-- Long axis: left-right -->
    <path d="M-24,0 C-8,2 -2,2 0,0 C-2,-2 -8,-2 -24,0"/>
    <path d="M24,0  C8,2  2,2  0,0 C2,-2  8,-2  24,0"/>
    <!-- Small diagonal sparkles -->
    <circle r="3.5"/>
  </g>
</svg>
