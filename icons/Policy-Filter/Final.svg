<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="50" fill="#1E293B"/>
  <!-- Checkered finish flag -->
  <g fill="white">
    <!-- Flag pole -->
    <rect x="30" y="24" width="4" height="52" rx="2"/>
    <!-- Flag body: 4×3 chequered squares -->
    <rect x="34" y="24" width="12" height="10"/>
    <rect x="46" y="24" width="12" height="10"/>
    <rect x="58" y="24" width="12" height="10"/>
    <rect x="34" y="44" width="12" height="10"/>
    <rect x="46" y="44" width="12" height="10"/>
    <rect x="58" y="44" width="12" height="10"/>
    <!-- Alternating dark squares (background shows through) -->
    <rect x="46" y="34" width="12" height="10" fill="#1E293B"/>
    <rect x="34" y="34" width="12" height="10" fill="white"/>
    <rect x="58" y="34" width="12" height="10" fill="#1E293B"/>
  </g>
</svg>
