<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="50" fill="#7C3AED"/>
  <!-- Game controller -->
  <g fill="white">
    <!-- Controller body -->
    <path d="M22,42 Q20,30 30,28 L70,28 Q80,30 78,42 L74,62 Q72,72 65,72 Q60,72 56,66 L44,66 Q40,72 35,72 Q28,72 26,62 Z"/>
    <!-- D-pad left side -->
    <rect x="30" y="46" width="14" height="6" rx="2" fill="#7C3AED"/>
    <!-- D-pad top/bottom -->
    <rect x="34" y="42" width="6" height="14" rx="2" fill="#7C3AED"/>
    <!-- Right buttons: 4 dots -->
    <circle cx="62" cy="45" r="3" fill="#7C3AED"/>
    <circle cx="70" cy="45" r="3" fill="#7C3AED"/>
    <circle cx="66" cy="40" r="3" fill="#7C3AED"/>
    <circle cx="66" cy="50" r="3" fill="#7C3AED"/>
    <!-- Analog sticks area -->
    <circle cx="40" cy="58" r="4" fill="#7C3AED"/>
    <circle cx="60" cy="58" r="4" fill="#7C3AED"/>
  </g>
</svg>
