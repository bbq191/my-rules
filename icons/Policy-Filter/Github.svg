<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="50" fill="#1F2937"/>
  <!-- Simplified Octocat: head + ears + body -->
  <g fill="white">
    <!-- Head -->
    <circle cx="50" cy="44" r="16"/>
    <!-- Left ear -->
    <polygon points="34,30 36,44 28,44"/>
    <!-- Right ear -->
    <polygon points="66,30 72,44 64,44"/>
    <!-- Body / tentacles suggestion -->
    <path d="M34,57 Q50,68 66,57 L66,64 Q50,76 34,64 Z"/>
    <!-- Tail flick -->
    <path d="M60,64 Q68,66 70,58" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <!-- Eye mask cutout -->
    <circle cx="43" cy="43" r="4" fill="#1F2937"/>
    <circle cx="57" cy="43" r="4" fill="#1F2937"/>
  </g>
</svg>
