<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="50" fill="#6D28D9"/>
  <g fill="white">
    <!-- Cloud base -->
    <circle cx="50" cy="62" r="11"/>
    <circle cx="38" cy="66" r="8"/>
    <circle cx="62" cy="66" r="8"/>
    <rect x="30" y="66" width="40" height="10" rx="0"/>
    <!-- Flower: 6 petals around center -->
    <ellipse cx="50" cy="36" rx="5" ry="9" transform="rotate(0 50 50)"/>
    <ellipse cx="50" cy="36" rx="5" ry="9" transform="rotate(60 50 50)"/>
    <ellipse cx="50" cy="36" rx="5" ry="9" transform="rotate(120 50 50)"/>
    <ellipse cx="50" cy="36" rx="5" ry="9" transform="rotate(180 50 50)"/>
    <ellipse cx="50" cy="36" rx="5" ry="9" transform="rotate(240 50 50)"/>
    <ellipse cx="50" cy="36" rx="5" ry="9" transform="rotate(300 50 50)"/>
    <!-- Flower center -->
    <circle cx="50" cy="50" r="7"/>
  </g>
  <!-- Center dot contrast -->
  <circle cx="50" cy="50" r="4" fill="#6D28D9"/>
</svg>
