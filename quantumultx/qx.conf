; 注意：QX 本地规则优先于远程规则匹配，这里只放需要"抢先"的精确 host 例外，
; 兜底的 geoip,cn 已移到 [filter_remote] 末尾（ChinaGeoIP.list），勿在此处添加 IP 类规则
; 企业内网域名（请自行填写）
; host-suffix, your-corp-domain.com, 国内
; 游戏：国际服 / 国内服
host-suffix, gryphline.com, Games
host-suffix, astral-vector.com, 国内
; DeepSeek 是国内直连 API，抢先直连，避免被 AI 远程规则带去境外
host-suffix, deepseek.com, 国内
host-suffix, local, direct
final, 全部节点

