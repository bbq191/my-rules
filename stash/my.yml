# 全局配置
mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15

external-controller: 127.0.0.1:9090
secret: "YOUR_API_SECRET"

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"
    - "+.baidu.com"

tun:
  enable: true
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  respect-rules: true
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:fakeipfilter_domain"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29

proxy-providers:
  Provider1:
    url: "YOUR_SUBSCRIPTION_URL_1"
    type: http
    interval: 14400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 120
  Provider2:
    url: "YOUR_SUBSCRIPTION_URL_2"
    type: http
    interval: 14400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 120

proxy-groups:
  # 社交
  - name: Telegram
    type: select
    proxies: [新加坡, 香港, 日本]
    icon: "https://raw.githubusercontent.com/bbq191/my-rules/main/icons/Policy-Filter/Telegram.svg"

  - name: 巴哈姆特
    type: select
    proxies: [台湾, 香港]
    icon: "https://raw.githubusercontent.com/bbq191/my-rules/main/icons/Policy-Filter/Bahamut.svg"

  - name: Games
    type: select
    proxies: [香港, 日本, 新加坡]
    icon: "https://raw.githubusercontent.com/bbq191/my-rules/main/icons/Policy-Filter/Games.svg"

  # 流媒体
  - name: YouTube
    type: select
    proxies: [美国, 香港, 日本, 新加坡]
    icon: "https://raw.githubusercontent.com/bbq191/my-rules/main/icons/Policy-Filter/YouTube.svg"

  # 厂商
  - name: AI
    type: select
    proxies: [美国, 香港]
    icon: "https://raw.githubusercontent.com/bbq191/my-rules/main/icons/Policy-Filter/AI.svg"

  - name: Github
    type: select
    proxies: [香港, 美国, DIRECT]
    icon: "https://raw.githubusercontent.com/bbq191/my-rules/main/icons/Policy-Filter/Github.svg"

  - name: Apple
    type: select
    proxies: [美国, 香港, DIRECT]
    icon: "https://raw.githubusercontent.com/bbq191/my-rules/main/icons/Policy-Filter/Apple.svg"

  - name: Microsoft
    type: select
    proxies: [美国, 香港, DIRECT]
    icon: "https://raw.githubusercontent.com/bbq191/my-rules/main/icons/Policy-Filter/Microsoft.svg"

  - name: Google
    type: select
    proxies: [美国, 香港, 日本, 台湾]
    icon: "https://raw.githubusercontent.com/bbq191/my-rules/main/icons/Policy-Filter/Google.svg"

  - name: 国内
    type: select
    proxies: [DIRECT, 全部节点]
    icon: "https://raw.githubusercontent.com/bbq191/my-rules/main/icons/Policy-Country/CN.svg"

  - name: Advertising
    type: select
    proxies: [REJECT, DIRECT]
    icon: "https://raw.githubusercontent.com/bbq191/my-rules/main/icons/Policy-Filter/AdBlock.svg"

  # 区域节点组（自动选择最低延迟）
  - name: 香港
    type: url-test
    include-all: true
    exclude-type: direct
    filter: "(?i)香港|hk|hongkong|hong kong"
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50
    icon: "https://raw.githubusercontent.com/bbq191/my-rules/main/icons/Policy-Country/HK.svg"

  - name: 台湾
    type: url-test
    include-all: true
    exclude-type: direct
    filter: "(?i)台湾|tw|taiwan"
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50
    icon: "https://raw.githubusercontent.com/bbq191/my-rules/main/icons/Policy-Country/TW.svg"

  - name: 日本
    type: url-test
    include-all: true
    exclude-type: direct
    filter: "(?i)日本|jp|japan"
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50
    icon: "https://raw.githubusercontent.com/bbq191/my-rules/main/icons/Policy-Country/JP.svg"

  - name: 美国
    type: url-test
    include-all: true
    exclude-type: direct
    filter: "(?i)美|us|unitedstates|united states"
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50
    icon: "https://raw.githubusercontent.com/bbq191/my-rules/main/icons/Policy-Country/US.svg"

  - name: 新加坡
    type: url-test
    include-all: true
    exclude-type: direct
    filter: "(?i)(新加坡|sg|singapore)"
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50
    icon: "https://raw.githubusercontent.com/bbq191/my-rules/main/icons/Policy-Country/SG.svg"

  - name: 其它地区
    type: select
    include-all: true
    exclude-type: direct
    filter: "(?i)^(?!.*(?:Expire|Traffic|失联|自动|最优|网站|地址|剩余|过期|时间|有效|🇭🇰|🇯🇵|🇺🇸|🇸🇬|🇨🇳|香港|hk|hongkong|台湾|tw|taiwan|日本|jp|japan|新|sg|singapore|美|us|unitedstates)).*"
    icon: "https://raw.githubusercontent.com/bbq191/my-rules/main/icons/Policy-Country/Other.svg"

  - name: 全部节点
    type: select
    include-all: true
    exclude-type: direct
    filter: "(?i)^(?!.*(?:失联|自动|最优|网站|地址|剩余|过期|时间|有效)).*"
    icon: "https://raw.githubusercontent.com/bbq191/my-rules/main/icons/Policy-Country/All.svg"

# 规则集模板（MRS 格式，需要 Stash 2.x / mihomo 内核）
rule-anchor:
  ip: &ip { type: http, interval: 86400, behavior: ipcidr, format: mrs }
  domain: &domain { type: http, interval: 86400, behavior: domain, format: mrs }

rule-providers:
  fakeipfilter_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/wwqgtxx/clash-rules/release/fakeip-filter.mrs"
  private_ip:
    <<: *ip
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs"
  private_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs"
  ai_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-!cn.mrs"
  github_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/github.mrs"
  youtube_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/youtube.mrs"
  google_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/google.mrs"
  apple_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/apple.mrs"
  microsoft_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/microsoft.mrs"
  telegram_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/telegram.mrs"
  category-games_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-games.mrs"
  category-game-platforms-download_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-game-platforms-download.mrs"
  playstation_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/playstation.mrs"
  bahamut_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/bahamut.mrs"
  ads_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads.mrs"
  ads@ads_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads@ads.mrs"
  geolocation-!cn:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/geolocation-!cn.mrs"
  google_ip:
    <<: *ip
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/google.mrs"
  telegram_ip:
    <<: *ip
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/telegram.mrs"
  cn_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs"
  cn_ip:
    <<: *ip
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs"

rules:
  # 游戏本地规则（按需自行添加）
  - DOMAIN-SUFFIX,gryphline.com,Games

  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,ai_domain,AI
  - RULE-SET,github_domain,Github
  - RULE-SET,youtube_domain,YouTube
  - RULE-SET,google_domain,Google
  - RULE-SET,apple_domain,Apple
  - RULE-SET,microsoft_domain,Microsoft
  - RULE-SET,telegram_domain,Telegram
  - RULE-SET,category-games_domain,Games
  - RULE-SET,category-game-platforms-download_domain,Games
  - RULE-SET,playstation_domain,Games
  - RULE-SET,bahamut_domain,巴哈姆特
  - RULE-SET,ads_domain,REJECT
  - RULE-SET,ads@ads_domain,REJECT
  - RULE-SET,geolocation-!cn,全部节点

  - RULE-SET,google_ip,Google,no-resolve
  - RULE-SET,telegram_ip,Telegram,no-resolve
  - RULE-SET,cn_domain,国内
  - RULE-SET,cn_ip,国内
  - MATCH,全部节点

http:
  mitm:
    - app.bilibili.com
    - api.live.bilibili.com
    - api.vc.bilibili.com
    - api.bilibili.com
    - manga.bilibili.com
    - grpc.biliapi.net
    - api.biliapi.net
    - sub.store
