rules:
  # 企业内网 / 工作应用域名（按需自行填写）
  # - DOMAIN-SUFFIX,your-corp-domain.com,国内

  # 游戏：国际服 / 国内服
  - DOMAIN-SUFFIX,gryphline.com,Games
  - DOMAIN-SUFFIX,astral-vector.com,国内

  - DOMAIN-SUFFIX,local,DIRECT
  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,private_domain,DIRECT
  # 广告拦截必须在厂商规则之前：google.mrs 本身包含 doubleclick 等广告域名
  - RULE-SET,ads_domain,REJECT
  - RULE-SET,ads@ads_domain,REJECT
  # DeepSeek 是国内直连 API，必须在 ai_domain 之前抢先直连，
  # 否则被 category-ai-!cn 命中后绕道境外，又慢又不稳定
  - DOMAIN-SUFFIX,deepseek.com,国内
  - RULE-SET,ai_domain,AI
  - RULE-SET,github_domain,Github
  - RULE-SET,youtube_domain,YouTube
  - RULE-SET,netflix_domain,GlobalMedia
  - RULE-SET,disney_domain,GlobalMedia
  - RULE-SET,hbo_domain,GlobalMedia
  - RULE-SET,primevideo_domain,GlobalMedia
  - RULE-SET,spotify_domain,GlobalMedia
  - RULE-SET,google_domain,Google
  - RULE-SET,apple_domain,Apple
  - RULE-SET,microsoft_domain,Microsoft
  - RULE-SET,telegram_domain,Telegram
  # 国内游戏（Steam 国区 CDN 等）先直连，category-games 里也含 mihoyo/4399 等国内域名，
  # 未被 @cn 覆盖的可在 Games 组手动切 DIRECT
  - RULE-SET,category-games@cn_domain,国内
  - RULE-SET,category-games_domain,Games
  - RULE-SET,category-game-platforms-download_domain,Games
  - RULE-SET,playstation_domain,Games
  - RULE-SET,bahamut_domain,巴哈姆特
  - RULE-SET,geolocation-!cn,全部节点

  - RULE-SET,google_ip,Google,no-resolve
  - RULE-SET,telegram_ip,Telegram,no-resolve
  - RULE-SET,cn_domain,国内
  - RULE-SET,cn_ip,国内
  - MATCH,全部节点

http:
  mitm:
    - app.bilibili.com
    - api.live.bilibili.com
    - api.vc.bilibili.com
    - api.bilibili.com
    - manga.bilibili.com
    - grpc.biliapi.net
    - api.biliapi.net
    - sub.store
