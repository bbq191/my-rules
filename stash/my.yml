# 全局配置
# 端口 / 局域网代理 / TUN / API 控制器等由 Stash 客户端界面管理，不在配置文件中声明；
# mihomo 专有键（unified-delay、tcp-concurrent、keep-alive、client-fingerprint、profile）Stash 不读取，已省略
mode: rule
log-level: warning
ipv6: false

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"
    - "+.baidu.com"

dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  respect-rules: true
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:fakeipfilter_domain"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 只用 UDP，避免 respect-rules 下 DoH 域名解析循环
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29

proxy-providers:
  Flowercloud:
    url: "YOUR_SUBSCRIPTION_URL_1"
    type: http
    interval: 14400
    icon: "https://raw.githubusercontent.com/bbq191/my-rules/main/icons/Policy-Provider/Flowercloud.png"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 120
    proxy: DIRECT
  Provider2:
    url: "YOUR_SUBSCRIPTION_URL_2"
    type: http
    interval: 14400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 120
    proxy: DIRECT

proxy-groups:
  # 社交
  - name: Telegram
    type: select
    proxies: [新加坡, 香港, 日本]
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Telegram.png"

  - name: 巴哈姆特
    type: select
    proxies: [台湾, 香港]
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Bahamut.png"

  - name: Games
    type: select
    proxies: [香港, 日本, 新加坡, DIRECT]
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Game.png"

  # 流媒体
  - name: YouTube
    type: select
    proxies: [美国, 香港, 日本, 新加坡]
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/YouTube.png"

  - name: GlobalMedia
    type: select
    proxies: [美国, 香港, 日本, 台湾, 新加坡]
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Stream.png"

  # 厂商
  - name: AI
    type: select
    proxies: [美国, 香港]
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/AI.png"

  - name: Github
    type: select
    proxies: [香港, 美国, DIRECT]
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/GitHub.png"

  - name: Apple
    type: select
    proxies: [美国, 香港, DIRECT]
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Apple.png"

  - name: Microsoft
    type: select
    proxies: [美国, 香港, DIRECT]
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Microsoft.png"

  - name: Google
    type: select
    proxies: [美国, 香港, 日本, 台湾]
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Google.png"

  - name: 国内
    type: select
    proxies: [DIRECT, 全部节点]
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/China.png"

  - name: Advertising
    type: select
    proxies: [REJECT, DIRECT]
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Adblock.png"

  # 区域节点组（手动选择）
  - name: 香港
    type: select
    include-all: true
    exclude-type: direct
    filter: "(?i)🇭🇰|香港|\bhk(?![a-z])|hong ?kong"
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Hong_Kong.png"

  - name: 台湾
    type: select
    include-all: true
    exclude-type: direct
    filter: "(?i)🇹🇼|台湾|\btw(?![a-z])|taiwan"
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Taiwan_Province.png"

  - name: 日本
    type: select
    include-all: true
    exclude-type: direct
    filter: "(?i)🇯🇵|日本|\bjp(?![a-z])|japan"
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Japan.png"

  - name: 美国
    type: select
    include-all: true
    exclude-type: direct
    filter: "(?i)🇺🇸|美国|\bus(?![a-z])|\busa(?![a-z])|united ?states"
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/USA.png"

  - name: 新加坡
    type: select
    include-all: true
    exclude-type: direct
    filter: "(?i)🇸🇬|新加坡|狮城|\bsg(?![a-z])|singapore"
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Singapore.png"

  - name: 其它地区
    type: select
    include-all: true
    exclude-type: direct
    filter: "(?i)^(?!.*(?:Expire|Traffic|失联|自动|最优|网站|地址|剩余|过期|时间|有效|🇭🇰|🇹🇼|🇯🇵|🇺🇸|🇸🇬|🇨🇳|香港|\bhk(?![a-z])|hong ?kong|台湾|\btw(?![a-z])|taiwan|日本|\bjp(?![a-z])|japan|新加坡|狮城|\bsg(?![a-z])|singapore|美国|\bus(?![a-z])|\busa(?![a-z])|united ?states)).*"
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Other.png"

  - name: 全部节点
    type: select
    include-all: true
    exclude-type: direct
    filter: "(?i)^(?!.*(?:失联|自动|最优|网站|地址|剩余|过期|时间|有效)).*"
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Global.png"

# 规则集模板（MRS 格式，需要 Stash 2.x / mihomo 内核）
rule-anchor:
  ip: &ip { type: http, interval: 86400, behavior: ipcidr, format: mrs }
  domain: &domain { type: http, interval: 86400, behavior: domain, format: mrs }

rule-providers:
  fakeipfilter_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/wwqgtxx/clash-rules/release/fakeip-filter.mrs"
  private_ip:
    <<: *ip
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs"
